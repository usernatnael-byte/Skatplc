name: Python checks

on:
  push:
    branches: [main, firestore-migration]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py bot.py database.py firebase_service.py models.py config.py
      - name: Flask health smoke test
        run: |
          python - <<'PY'
          from app import app
          client = app.test_client()
          response = client.get("/")
          assert response.status_code == 200, response.data
          assert response.get_json()["database"] == "cloud_firestore"
          assert client.get("/api/cartela?id=123").status_code == 401
          print("Flask smoke tests passed")
          PY
