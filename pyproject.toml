[project]
name = "efona-bingo"
version = "0.2.0"
description = "Efona Bingo Flask and Telegram application using Cloud Firestore"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.0",
    "gunicorn==23.0.0",
    "firebase-admin==6.5.0",
    "python-telegram-bot==21.10",
    "python-dotenv==1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
