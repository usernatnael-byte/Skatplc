services:
  - type: web
    name: efona-bingo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: FLASK_SECRET
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: RUN_TELEGRAM_BOT
        value: "true"
