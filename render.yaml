services:
  - type: web
    name: efona-bingo-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: efona-bingo-db
          property: connectionString
      - key: FLASK_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: worker
    name: efona-bingo-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: efona-bingo-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: EfonaBingoBot
      - key: ADMIN_IDS
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: FLASK_SECRET
        fromService:
          type: web
          name: efona-bingo-web
          envVarKey: FLASK_SECRET
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

databases:
  - name: efona-bingo-db
    plan: basic-256mb
