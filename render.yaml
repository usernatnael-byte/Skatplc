services:
  - type: web
    name: efona-bingo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: EFONA_FLASK_SECRET
        generateValue: true
      - key: EFONA_ADMIN_API_TOKEN
        generateValue: true
      - key: EFONA_FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: EFONA_BOT_TOKEN
        sync: false
      - key: EFONA_ADMIN_IDS
        sync: false
      - key: EFONA_WEBAPP_URL
        sync: false
      - key: EFONA_RUN_TELEGRAM_BOT
        value: "true"
