<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Efona Bingo</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#101322;color:#fff;font:15px Arial;text-align:center;padding:16px}h1{color:#ffd166}.panel{max-width:760px;margin:14px auto;background:#1b2235;border:1px solid #303a54;border-radius:14px;padding:16px}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button,select{padding:11px 14px;border:0;border-radius:8px;background:#e58b25;color:#fff;font-weight:bold}button:disabled{opacity:.5}.games{display:grid;gap:8px}.game{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#252f49;padding:12px;border-radius:9px}.board{display:grid;grid-template-columns:repeat(5,minmax(42px,1fr));gap:6px;max-width:420px;margin:14px auto}.cell{padding:13px 2px;background:#34415e;border-radius:7px;font-weight:bold}.cell.called{background:#2e9d68}.cell.free{background:#e58b25}.numbers{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.numbers span{background:#303b55;padding:7px;border-radius:5px}.small{color:#aab3c5}.error{color:#ff8585}
</style></head><body><h1>🎯 Efona Bingo</h1><p class="small">Welcome! Join a game using your Telegram balance.</p><div id="error" class="error"></div>
<section class="panel"><h2>Available games</h2><div id="games" class="games">Loading…</div><div class="row"><select id="entry"><option value="10">10 ETB</option><option value="20">20 ETB</option><option value="50">50 ETB</option><option value="100">100 ETB</option></select><button onclick="createGame()">Create game</button><button onclick="loadGames()">Refresh</button></div></section>
<section class="panel" id="play" hidden><h2 id="gameTitle">Your Cartela</h2><p id="gameStats" class="small"></p><div class="board" id="board"></div><h3>Called numbers</h3><div class="numbers" id="called"></div><p id="winner"></p><button onclick="claim()">🎉 BINGO!</button><button onclick="loadGame()">Refresh game</button></section>
<script>
const tg=window.Telegram?.WebApp;if(tg)tg.ready();const initData=tg?.initData||"";
const headers={"Content-Type":"application/json","X-Telegram-Init-Data":initData};let activeGame=null;
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers,...opts.headers}});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d}
function err(e){document.getElementById("error").textContent=e.message}
async function loadGames(){try{const games=await api("/api/games");const root=document.getElementById("games");root.innerHTML="";if(!games.length){root.textContent="No games available yet.";return}games.forEach(g=>{const row=document.createElement("div");row.className="game";const info=document.createElement("span");info.textContent="#"+g.id.slice(0,7)+" · "+g.status+" · "+g.players+" players · "+g.entry_price+" ETB";const btn=document.createElement("button");btn.textContent="Join";btn.onclick=()=>join(g.id);row.append(info,btn);root.append(row)})}catch(e){err(e)}}
async function createGame(){try{const d=await api("/api/games",{method:"POST",body:JSON.stringify({entry_price:Number(document.getElementById("entry").value)})});await loadGames();await join(d.game_id)}catch(e){err(e)}}
async function join(id){try{const d=await api("/api/games/"+id+"/join",{method:"POST",body:"{}"});activeGame=id;renderBoard(d.board);document.getElementById("play").hidden=false;await loadGame()}catch(e){err(e)}}
function renderBoard(board,called=[]){const root=document.getElementById("board");root.innerHTML="";board.forEach(n=>{const c=document.createElement("div");c.className="cell"+(n===0?" free":"")+(called.includes(n)&&n!==0?" called":"");c.textContent=n===0?"FREE":n;root.append(c)})}
async function loadGame(){if(!activeGame)return;try{const g=await api("/api/games/"+activeGame);if(!g.player){err(new Error("You have not joined this game"));return}renderBoard(g.player.board,g.called_numbers);document.getElementById("gameTitle").textContent="Game "+g.id+" · "+g.status;document.getElementById("gameStats").textContent="Entry "+g.entry_price+" ETB · Pool "+g.pool+" ETB · Current "+(g.current_number||"—");const c=document.getElementById("called");c.innerHTML="";g.called_numbers.forEach(n=>{const s=document.createElement("span");s.textContent=n;c.append(s)});if(g.status==="finished")document.getElementById("winner").textContent=g.winner_id?"Winner: "+g.winner_id:"Game finished"}catch(e){err(e)}}
async function claim(){if(!activeGame)return;try{const d=await api("/api/games/"+activeGame+"/claim",{method:"POST",body:"{}"});document.getElementById("winner").textContent="🎉 Bingo confirmed! Prize: "+d.prize+" ETB";await loadGame()}catch(e){err(e)}}
loadGames();setInterval(()=>{loadGames();loadGame()},4000);
</script></body></html>
