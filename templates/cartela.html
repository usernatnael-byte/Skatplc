<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Efona Bingo Cartela</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cartela.css') }}">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header>
    <h1>🎯 Efona Bingo</h1>
    <p>Game ID: <span id="game-id">{{ game_id }}</span> · Entry: {{ entry_price }} ETB</p>
  </header>
  <div id="error" role="alert" style="color:#b00020"></div>
  <div id="loading">Loading your cartela…</div>
  <section>
    <h2>Your Cartela</h2>
    <div class="cartela-grid" id="cartela"></div>
  </section>
  <section>
    <h2>Called numbers</h2>
    <div class="grid" id="bonus-numbers"></div>
  </section>
  <div id="win-banner" style="display:none">🎉 Bingo!</div>
  <section id="controls">
    <button id="refresh" type="button">↻ Refresh cartela</button>
    <button id="add-cartela" type="button">＋ Generate new cartela</button>
  </section>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) tg.ready();
    const initData = tg ? tg.initData : "";
    const headers = {"Content-Type":"application/json","X-Telegram-Init-Data":initData};
    const grid = document.getElementById("cartela");
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");

    function render(numbers) {
      grid.innerHTML = "";
      numbers.forEach((n, i) => {
        const cell = document.createElement("div");
        cell.className = "number selected";
        cell.textContent = n;
        grid.appendChild(cell);
      });
    }
    function newBoard() {
      const ranges = [[1,15],[16,30],[31,45],[46,60],[61,75]];
      const cols = ranges.map(([min,max]) => {
        const values = [];
        while (values.length < 5) {
          const n = Math.floor(Math.random() * (max-min+1)) + min;
          if (!values.includes(n)) values.push(n);
        }
        return values;
      });
      return Array.from({length:5}, (_, row) => cols.flatMap(col => col[row]));
    }
    async function loadCartela() {
      loading.style.display = "block";
      errorBox.textContent = "";
      try {
        const res = await fetch("/api/cartela", {headers});
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Unable to load cartela");
        render(data.cartela);
      } catch (err) {
        errorBox.textContent = err.message + ". Open this page from the Telegram bot.";
      } finally {
        loading.style.display = "none";
      }
    }
    document.getElementById("refresh").onclick = loadCartela;
    document.getElementById("add-cartela").onclick = async () => {
      try {
        const res = await fetch("/api/cartela", {
          method:"POST", headers,
          body:JSON.stringify({cartela:newBoard()})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Unable to save cartela");
        render(data.cartela);
      } catch (err) { errorBox.textContent = err.message; }
    };
    loadCartela();
  </script>
</body>
</html>
